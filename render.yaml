# Render Blueprint for the Afterglow API.
#
# The frontend is deployed on Vercel and proxies /api/* here. The SQLite
# database lives on a persistent disk because Vercel's serverless filesystem
# cannot store it. Disks require a paid instance type on Render.
services:
  - type: web
    name: afterglow-api
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: DATABASE_FILE
        value: /var/data/afterglow.db
      - key: SEED_ON_START
        value: "true"
      - key: SEED_DEMO_USER
        value: "true"
      - key: CURRENCY
        value: USD
      - key: DISTANCE_UNIT
        value: miles
    disk:
      name: afterglow-data
      mountPath: /var/data
      sizeGB: 1
